user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Do not expose nginx version
    server_tokens  off;

    # Gzip compression for static assets
    gzip             on;
    gzip_comp_level  5;
    gzip_min_length  256;
    gzip_types       text/plain text/css application/javascript application/json
                     application/xml image/svg+xml font/woff font/woff2;

    server {
        listen  80;
        root    /usr/share/nginx/html;
        index   index.html;

        # Docker internal DNS resolver with 10s TTL for dynamic container IP resolution
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;

        # Upstream backend variable for dynamic DNS re-resolution
        set $backend_upstream "http://backend:8000";

        # Global security headers
        add_header  X-Content-Type-Options  "nosniff"           always;
        add_header  X-Frame-Options         "DENY"              always;
        add_header  Referrer-Policy         "strict-origin-when-cross-origin"  always;

        # Health endpoint proxy to backend
        location = /health {
            proxy_pass              $backend_upstream$request_uri;
            proxy_http_version      1.1;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
        }

        # Database health endpoint proxy to backend
        location = /health/db {
            proxy_pass              $backend_upstream$request_uri;
            proxy_http_version      1.1;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
        }

        # API reverse proxy to backend FastAPI service
        location /api/ {
            proxy_pass              $backend_upstream$request_uri;
            proxy_http_version      1.1;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;

            proxy_connect_timeout   30s;
            proxy_send_timeout      120s;
            proxy_read_timeout      120s;
        }

        # Cached compiled assets
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Favicon and root static files
        location = /favicon.ico {
            try_files $uri =204;
            access_log off;
            log_not_found off;
        }

        # React SPA Fallback: serve index.html for all client routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
